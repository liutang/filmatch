services:
  filmatch:
    image: ghcr.io/liutang/filmatch:latest
    container_name: filmatch
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # A named volume deploys anywhere (Portainer included) with no path to
      # edit. To keep my-spools.json on the host instead, replace this with an
      # absolute bind mount, e.g. /volume1/docker/filmatch:/data, and make sure
      # that directory is writable by uid 1000.
      - filmatch-data:/data

    # Optional flags, appended to the image's entrypoint (a later flag wins):
    # command: ["--suggest", "--include", "silk"]

    # To build from a clone rather than pull the published image, uncomment
    # this and drop the `image:` line. Don't do this in a Portainer stack --
    # it has no build context and the build will fail.
    # build: .

volumes:
  filmatch-data:
