name: Publish container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # QEMU lets the amd64 runner build the arm64 image too, so the same tag
      # works on a NAS, a mini PC, or a Raspberry Pi.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Also stamps org.opencontainers.image.source, which links the package to
      # this repository on GHCR.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the image actually starts and serves the page, not just that it
      # builds -- a broken entrypoint or a missing web/ would pass the build.
      - name: Smoke test the published image
        run: |
          set -eux
          IMAGE=ghcr.io/${{ github.repository }}:sha-$(echo "${GITHUB_SHA}" | cut -c1-7)
          docker run -d --name smoke -p 8765:8765 "$IMAGE"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ | grep -q 'id="drop"'
          curl -fsS -o /dev/null -w 'report.css %{http_code}\n' http://127.0.0.1:8765/report.css
          docker logs smoke
          docker rm -f smoke
